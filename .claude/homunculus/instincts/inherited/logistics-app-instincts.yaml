# Logistics App Workflow Add New Domain Entity With Crud And Api

## Action

Follow the add-new-domain-entity-with-crud-and-api workflow:
1. Create new Eloquent model in app/Models/
2. Create database migration in database/migrations/
3. Create factory in database/factories/
4. Create Form Request validation classes in app/Http/Requests/[Domain]/
5. Create Resource classes in app/Http/Resources/
6. Create Controller in app/Http/Controllers/Api/
7. Add CRUD endpoints to routes/api.php (or ensure controller is registered)
8. Create feature tests in tests/Feature/
9. Optionally: add repository/service layer and DTOs in app/Domain/[Domain]/

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: api/app/Models/*.php, api/database/migrations/*_create_*_table.php, api/database/factories/*Factory.php

