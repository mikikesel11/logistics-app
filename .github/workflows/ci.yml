name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Laravel / Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, bcmath, pdo_sqlite, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env (SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest
        run: php artisan test
        # TODO: enable coverage gating (--coverage --min=80) once a coverage
        # driver (pcov) is pinned and the web/ suite exists, so the threshold
        # reflects the whole app rather than the backend in isolation.

  web:
    name: Web (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # web/ is added in a later phase. Until it exists, this job no-ops green.
      - name: Detect web app
        id: guard
        run: |
          if [ -f web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web/ not scaffolded yet — skipping."
          fi

      - name: Setup Node
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        working-directory: web
        run: npm ci

      - name: Lint
        if: steps.guard.outputs.exists == 'true'
        working-directory: web
        run: npm run lint --if-present

      - name: Build
        if: steps.guard.outputs.exists == 'true'
        working-directory: web
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The SPA and API are driven together, so this only runs once both are present.
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, bcmath, pdo_sqlite, gd
          coverage: none

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare API (SQLite, seeded)
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force

      - name: Start API server
        working-directory: api
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          # Wait until the health endpoint responds before driving the SPA.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is up."; exit 0
            fi
            sleep 1
          done
          echo "API failed to start:"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: web
        # Playwright starts the Vite dev server itself (proxying /api -> :8000).
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
